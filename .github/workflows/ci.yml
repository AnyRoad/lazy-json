name: CI

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run quality checks
        run: make check

      - name: Build binary
        run: make build
