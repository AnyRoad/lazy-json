name: CI

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run quality checks
        run: make check

      - name: Build binary
        run: make build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazy-json-linux-amd64
          path: dist/lazy-json
          if-no-files-found: error
