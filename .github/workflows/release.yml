name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
          APP_NAME: lazy-json
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist package
          BIN_NAME="$APP_NAME"
          if [ "$GOOS" = "windows" ]; then
            BIN_NAME="$APP_NAME.exe"
          fi

          GOOS="$GOOS" GOARCH="$GOARCH" go build -o "package/$BIN_NAME" ./cmd/lazy-json

          ARCHIVE_NAME="${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$ARCHIVE" = "zip" ]; then
            (
              cd package
              zip -q "../dist/${ARCHIVE_NAME}.zip" "$BIN_NAME"
            )
          else
            tar -C package -czf "dist/${ARCHIVE_NAME}.tar.gz" "$BIN_NAME"
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazy-json-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -eu
          cd dist
          shasum -a 256 * > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --title "$VERSION" --generate-notes
          gh release upload "$VERSION" dist/* --clobber
